<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九九乘法找找看</title>
<style>
  :root {
    --cell: clamp(25px, calc(10vw - 7px), 48px);
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fff3d6 0%, #e3f6ff 45%, #ffe1ef 100%);
    color: #33324a;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow-x: hidden;
  }
  .game-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }
  h1 { margin: 4px 0; font-size: 1.5rem; color: #ff6b9d; text-shadow: 0 2px 0 #fff; }
  .hud {
    display: flex;
    gap: 18px;
    font-size: 1rem;
    background: rgba(255,255,255,.7);
    padding: 6px 18px;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    flex-wrap: wrap;
    justify-content: center;
  }
  .hud b { color: #ff9f43; }
  .target-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff8ea;
    border: 4px solid #ffd166;
    border-radius: 20px;
    padding: 10px 26px;
    box-shadow: 0 8px 24px rgba(80,50,140,.15);
  }
  .target-label { font-size: 1rem; opacity: .7; }
  .target-num {
    font-size: 2.4rem;
    font-weight: 800;
    color: #ff6b9d;
    min-width: 1.4em;
    text-align: center;
    animation: popIn .25s ease;
  }
  @keyframes popIn {
    0% { transform: scale(.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .hint { opacity: .65; font-size: .85rem; text-align: center; max-width: 480px; }
  .board-wrap { position: relative; }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(10, var(--cell));
    grid-template-rows: repeat(10, var(--cell));
    gap: 3px;
    background: #fffdf6;
    padding: 8px;
    border-radius: 16px;
    border: 4px solid #4fc3f7;
    box-shadow: 0 8px 24px rgba(80,50,140,.15);
  }
  .cell, .headcell, .corner {
    width: var(--cell);
    height: var(--cell);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: calc(var(--cell) * .32);
  }
  .corner { background: transparent; }
  .headcell {
    background: #e3f6ff;
    color: #33324a;
  }
  .headcell.practice { background: #4fc3f7; color: #fff; }
  .cell.inactive { background: #f2f0e6; color: #b9b6a8; }
  .cell.active {
    background: #fff;
    color: #fff;
    border: 2px solid #a78bfa;
    cursor: pointer;
    transition: transform .1s, background .15s;
  }
  .cell.active:active { transform: scale(.92); }
  .cell.solved {
    background: #6bd67a;
    color: #fff;
    box-shadow: inset 0 0 0 2px #ffffff88;
  }
  .cell.flash-correct { animation: flashGreen .4s ease; }
  @keyframes flashGreen {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); background: #ffd166; }
    100% { transform: scale(1); }
  }
  .cell.flash-wrong { animation: shakeRed .35s ease; }
  @keyframes shakeRed {
    0%, 100% { transform: translateX(0); background: #fff; }
    25% { transform: translateX(-6px); background: #ff9f9f; }
    75% { transform: translateX(6px); background: #ff9f9f; }
  }
  .floatScore {
    position: absolute;
    transform: translate(-50%, -50%);
    font-weight: 800;
    font-size: 1.15rem;
    text-shadow: 0 0 4px #fff, 0 2px 0 #fff;
    pointer-events: none;
    animation: floatUp .8s ease-out forwards;
    z-index: 3;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%, -50%); opacity: 1; }
    100% { transform: translate(-50%, -140%); opacity: 0; }
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #4fc3f7;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  #restartBtn { background: #ff6b9d; }
  #settingsBtn { background: #a78bfa; }
  #pauseBtn { background: #ff9f43; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  #pauseOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    background: rgba(51,50,74,.6);
    border-radius: 16px;
    color: #fff;
    font-size: 1.4rem;
    font-weight: 800;
    text-align: center;
    cursor: pointer;
    z-index: 5;
  }
  #pauseOverlay span { font-size: .95rem; font-weight: 400; }
  #pauseOverlay.show { display: flex; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(51,50,74,.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    color: #fff;
    z-index: 2;
  }
  .modal-overlay.show { display: flex; }
  .overlay-card {
    position: relative;
    background: #fff8ea;
    color: #33324a;
    padding: 28px 36px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    max-width: 90vw;
  }
  .overlay-card h2 { color: #ff6b9d; margin-top: 0; }
  .modal-close {
    display: none;
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    background: #ff9f9f;
    box-shadow: none;
    font-size: 1rem;
    line-height: 1;
  }
  .table-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 320px;
    margin: 14px auto;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #e3f6ff;
    border: 2px solid #4fc3f7;
    color: #33324a;
    font-weight: 700;
    cursor: pointer;
  }
  .chip input { display: none; }
  .chip:has(input:checked) { background: #4fc3f7; color: #fff; }
  .setup-actions { display: flex; gap: 8px; justify-content: center; }
  .fireworks {
    height: 92px;
    position: relative;
    overflow: hidden;
    margin: 6px 0 12px;
  }
  .fireworks span {
    position: absolute;
    left: var(--x);
    top: var(--y);
    font-size: 1.8rem;
    animation: burst .9s ease-in-out infinite;
    animation-delay: var(--d);
  }
  @keyframes burst {
    0%, 100% { transform: scale(.65); opacity: .55; }
    50% { transform: scale(1.35); opacity: 1; }
  }
  @media (max-width: 700px) {
    .game-wrap { gap: 8px; padding: 8px; }
    h1 { font-size: 1.15rem; margin: 0; }
    .hud { gap: 8px; padding: 5px 10px; font-size: .82rem; }
    .target-wrap { padding: 8px 18px; }
    .target-num { font-size: 1.9rem; }
    .hint { display: none; }
    .overlay-card { padding: 20px 16px; border-radius: 14px; }
  }
  .home-link {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 20;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    text-decoration: none;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
  }
  .home-link:active { transform: scale(.92); }
</style>
</head>
<body>
  <a href="../../index.html" target="_top" class="home-link" aria-label="返回主選單" title="返回主選單">🏠</a>
  <div class="game-wrap">
    <h1>🔍 九九乘法找找看</h1>
    <div class="hud">
      <div>找到: <b id="correctCount">0</b></div>
      <div>錯誤: <b id="mistakeCount">0</b></div>
      <div>時間: <b id="timeDisplay">0s</b></div>
      <div>最佳: <b id="bestDisplay">--</b></div>
    </div>
    <div class="target-wrap">
      <div class="target-label">目標數字</div>
      <div class="target-num" id="targetNum">--</div>
    </div>
    <div class="board-wrap">
      <div id="board"></div>
      <div id="pauseOverlay">⏸ 暫停中<br><span>點一下繼續</span></div>
    </div>
    <div class="controls">
      <button id="pauseBtn">⏸ 暫停</button>
      <button id="restartBtn">重新開始</button>
      <button id="settingsBtn">⚙️ 設定</button>
    </div>
    <div class="hint">在乘法表中找出「幾 × 幾 = 目標數字」的格子並點下去，找完全部格子就過關！</div>
  </div>

  <div id="setupOverlay" class="modal-overlay show">
    <div class="overlay-card">
      <button id="setupCloseBtn" class="modal-close" type="button">✕</button>
      <h2>選擇要練習的乘法表</h2>
      <div class="table-picker">
        <label class="chip"><input type="checkbox" value="1">1</label>
        <label class="chip"><input type="checkbox" value="2">2</label>
        <label class="chip"><input type="checkbox" value="3">3</label>
        <label class="chip"><input type="checkbox" value="4">4</label>
        <label class="chip"><input type="checkbox" value="5">5</label>
        <label class="chip"><input type="checkbox" value="6">6</label>
        <label class="chip"><input type="checkbox" value="7">7</label>
        <label class="chip"><input type="checkbox" value="8">8</label>
        <label class="chip"><input type="checkbox" value="9">9</label>
      </div>
      <div class="setup-actions">
        <button id="selectAllBtn" type="button">全選</button>
        <button id="selectNoneBtn" type="button">全不選</button>
      </div>
      <button id="startGameBtn" style="margin-top:16px;">開始遊戲 ▶</button>
    </div>
  </div>

  <div id="winOverlay" class="modal-overlay">
    <div class="overlay-card">
      <h2>全部找到了！🎉</h2>
      <div class="fireworks" aria-hidden="true">
        <span style="--x:8%; --y:34%; --d:0s;">🎆</span>
        <span style="--x:26%; --y:6%; --d:.18s;">✨</span>
        <span style="--x:44%; --y:42%; --d:.08s;">🎇</span>
        <span style="--x:62%; --y:12%; --d:.28s;">✨</span>
        <span style="--x:80%; --y:36%; --d:.14s;">🎆</span>
      </div>
      <p id="winSummary"></p>
      <button id="winRestart" type="button">再玩一次</button>
    </div>
  </div>

<script>
const N = 9;
let selectedTables = new Set([1, 2, 3, 4, 5, 6, 7, 8, 9]);

const boardEl = document.getElementById("board");
const targetNumEl = document.getElementById("targetNum");
const correctCountEl = document.getElementById("correctCount");
const mistakeCountEl = document.getElementById("mistakeCount");
const timeDisplayEl = document.getElementById("timeDisplay");
const bestDisplayEl = document.getElementById("bestDisplay");
const pauseOverlayEl = document.getElementById("pauseOverlay");
const pauseBtn = document.getElementById("pauseBtn");
const winOverlayEl = document.getElementById("winOverlay");
const winSummaryEl = document.getElementById("winSummary");
const setupOverlay = document.getElementById("setupOverlay");
const setupCloseBtn = document.getElementById("setupCloseBtn");
const tableCheckboxes = [...document.querySelectorAll(".table-picker input[type=checkbox]")];

let cellEls = {};      // "x,y" -> div
let activeSet = new Set();
let remaining = [];
let filled = new Set();
let target = null;
let correctCount = 0;
let mistakeCount = 0;
let elapsedMs = 0;
let timerStart = 0;
let timerHandle = null;
let paused = false;
let gameStarted = false;
let resumeAfterSettings = false;

function key(x, y) { return x + "," + y; }

function bestKey() {
  return "times99find_best_" + [...selectedTables].sort((a, b) => a - b).join("");
}

function loadBest() {
  const v = localStorage.getItem(bestKey());
  bestDisplayEl.textContent = v ? formatTime(Number(v)) : "--";
}

function formatTime(ms) {
  return (ms / 1000).toFixed(1) + "s";
}

function buildBoard() {
  boardEl.innerHTML = "";
  cellEls = {};
  const corner = document.createElement("div");
  corner.className = "corner";
  boardEl.appendChild(corner);
  for (let j = 1; j <= N; j++) {
    const h = document.createElement("div");
    h.className = "headcell" + (selectedTables.has(j) ? " practice" : "");
    h.textContent = j;
    boardEl.appendChild(h);
  }
  for (let i = 1; i <= N; i++) {
    const h = document.createElement("div");
    h.className = "headcell" + (selectedTables.has(i) ? " practice" : "");
    h.textContent = i;
    boardEl.appendChild(h);
    for (let j = 1; j <= N; j++) {
      const div = document.createElement("div");
      const active = selectedTables.has(i) || selectedTables.has(j);
      div.className = "cell " + (active ? "active" : "inactive");
      div.textContent = active ? "" : String(i * j);
      if (active) div.addEventListener("click", () => onCellClick(i, j));
      boardEl.appendChild(div);
      cellEls[key(i, j)] = div;
    }
  }
}

function pickNextTarget() {
  if (remaining.length === 0) { winGame(); return; }
  const [x, y] = remaining[Math.floor(Math.random() * remaining.length)];
  target = x * y;
  targetNumEl.textContent = target;
  targetNumEl.style.animation = "none";
  void targetNumEl.offsetWidth;
  targetNumEl.style.animation = "popIn .25s ease";
}

function onCellClick(x, y) {
  if (paused || !gameStarted) return;
  const k = key(x, y);
  if (filled.has(k)) return;
  const div = cellEls[k];
  if (x * y === target) {
    filled.add(k);
    remaining = remaining.filter(([a, b]) => !(a === x && b === y));
    correctCount++;
    correctCountEl.textContent = correctCount;
    div.textContent = target;
    div.classList.remove("active");
    div.classList.add("solved", "flash-correct");
    spawnFloatScore(div, "+10", "#6bd67a");
    setTimeout(() => div.classList.remove("flash-correct"), 400);
    pickNextTarget();
  } else {
    mistakeCount++;
    mistakeCountEl.textContent = mistakeCount;
    div.classList.add("flash-wrong");
    spawnFloatScore(div, "✕", "#ff5d5d");
    setTimeout(() => div.classList.remove("flash-wrong"), 350);
  }
}

function spawnFloatScore(div, label, color) {
  const el = document.createElement("div");
  el.className = "floatScore";
  el.textContent = label;
  el.style.color = color;
  el.style.left = div.offsetLeft + div.offsetWidth / 2 + "px";
  el.style.top = div.offsetTop + div.offsetHeight / 2 + "px";
  boardEl.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}

function tickTimer() {
  if (paused) return;
  elapsedMs = Date.now() - timerStart;
  timeDisplayEl.textContent = formatTime(elapsedMs);
}

function winGame() {
  gameStarted = false;
  clearInterval(timerHandle);
  targetNumEl.textContent = "🎉";
  const best = Number(localStorage.getItem(bestKey())) || null;
  if (!best || elapsedMs < best) {
    localStorage.setItem(bestKey(), String(elapsedMs));
  }
  loadBest();
  winSummaryEl.textContent = `花費時間：${formatTime(elapsedMs)}　錯誤次數：${mistakeCount}`;
  winOverlayEl.classList.add("show");
}

function startGame() {
  buildBoard();
  activeSet = new Set();
  remaining = [];
  filled = new Set();
  for (let i = 1; i <= N; i++) {
    for (let j = 1; j <= N; j++) {
      if (selectedTables.has(i) || selectedTables.has(j)) {
        activeSet.add(key(i, j));
        remaining.push([i, j]);
      }
    }
  }
  correctCount = 0;
  mistakeCount = 0;
  correctCountEl.textContent = "0";
  mistakeCountEl.textContent = "0";
  elapsedMs = 0;
  timeDisplayEl.textContent = "0.0s";
  paused = false;
  pauseBtn.textContent = "⏸ 暫停";
  pauseOverlayEl.classList.remove("show");
  winOverlayEl.classList.remove("show");
  loadBest();
  gameStarted = true;
  pickNextTarget();
  timerStart = Date.now();
  clearInterval(timerHandle);
  timerHandle = setInterval(tickTimer, 100);
}

function togglePause() {
  if (!gameStarted) return;
  paused = !paused;
  pauseBtn.textContent = paused ? "▶ 繼續" : "⏸ 暫停";
  pauseOverlayEl.classList.toggle("show", paused);
  if (paused) {
    elapsedMs = Date.now() - timerStart;
  } else {
    timerStart = Date.now() - elapsedMs;
  }
}

pauseBtn.onclick = togglePause;
pauseOverlayEl.onclick = togglePause;
document.getElementById("restartBtn").onclick = startGame;
document.getElementById("winRestart").onclick = startGame;

document.getElementById("selectAllBtn").onclick = () => tableCheckboxes.forEach(cb => cb.checked = true);
document.getElementById("selectNoneBtn").onclick = () => tableCheckboxes.forEach(cb => cb.checked = false);

document.getElementById("settingsBtn").onclick = () => {
  resumeAfterSettings = gameStarted && !paused;
  if (gameStarted) togglePause();
  setupCloseBtn.style.display = gameStarted ? "flex" : "none";
  setupOverlay.classList.add("show");
};

setupCloseBtn.onclick = () => {
  setupOverlay.classList.remove("show");
  if (resumeAfterSettings) togglePause();
};

document.getElementById("startGameBtn").onclick = () => {
  const chosen = tableCheckboxes.filter(cb => cb.checked).map(cb => Number(cb.value));
  selectedTables = new Set(chosen.length ? chosen : [1, 2, 3, 4, 5, 6, 7, 8, 9]);
  tableCheckboxes.forEach(cb => cb.checked = selectedTables.has(Number(cb.value)));
  setupOverlay.classList.remove("show");
  startGame();
};
</script>
</body>
</html>
