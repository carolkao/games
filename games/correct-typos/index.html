<title>改錯字打怪大作戰</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fff3d6 0%, #e3f6ff 45%, #ffe1ef 100%);
    color: #33324a;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow-x: hidden;
  }
  .game-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 16px;
  }
  h1 { margin: 4px 0; font-size: 1.5rem; color: #ff6b9d; text-shadow: 0 2px 0 #fff; text-align: center; }

  .arena {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 560px;
    background: rgba(255,255,255,.7);
    border-radius: 20px;
    padding: 10px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    overflow: hidden;
  }
  .projectile {
    position: absolute;
    top: 46%;
    font-size: 1.6rem;
    pointer-events: none;
    z-index: 8;
  }
  @keyframes flyRight {
    0% { left: 20%; opacity: 0; transform: translateY(-50%) scale(.6) rotate(0deg); }
    15% { opacity: 1; transform: translateY(-50%) scale(1) rotate(0deg); }
    100% { left: 76%; opacity: 0; transform: translateY(-50%) scale(1.2) rotate(25deg); }
  }
  @keyframes flyLeft {
    0% { left: 76%; opacity: 0; transform: translateY(-50%) scale(.6) rotate(0deg); }
    15% { opacity: 1; transform: translateY(-50%) scale(1) rotate(0deg); }
    100% { left: 20%; opacity: 0; transform: translateY(-50%) scale(1.2) rotate(-25deg); }
  }
  .projectile.fly-right { animation: flyRight .35s ease-in forwards; }
  .projectile.fly-left { animation: flyLeft .35s ease-in forwards; }
  .fighter { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100px; }
  .fighter .emoji { font-size: 2.6rem; transition: transform .15s; }
  .fighter .emoji.hit { animation: hitShake .35s ease; }
  @keyframes hitShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px) rotate(-6deg); }
    75% { transform: translateX(8px) rotate(6deg); }
  }
  @keyframes lungeRight {
    0% { transform: translateX(0) scale(1); }
    45% { transform: translateX(36px) scale(1.18) rotate(-6deg); }
    100% { transform: translateX(0) scale(1); }
  }
  @keyframes lungeLeft {
    0% { transform: translateX(0) scale(1); }
    45% { transform: translateX(-36px) scale(1.18) rotate(6deg); }
    100% { transform: translateX(0) scale(1); }
  }
  .fighter .emoji.lunge-right { animation: lungeRight .5s ease; }
  .fighter .emoji.lunge-left { animation: lungeLeft .5s ease; }
  .burst {
    position: absolute;
    top: -6px;
    left: 50%;
    font-size: 1.6rem;
    pointer-events: none;
    animation: popBurst .5s ease-out forwards;
    z-index: 5;
  }
  @keyframes popBurst {
    0% { transform: translateX(-50%) scale(.3); opacity: 0; }
    40% { transform: translateX(-50%) scale(1.3); opacity: 1; }
    100% { transform: translateX(-50%) scale(1.6); opacity: 0; }
  }
  .dmgFloat {
    position: absolute;
    top: 10px;
    left: 50%;
    font-weight: 800;
    font-size: 1.2rem;
    color: #ff5d5d;
    text-shadow: 0 0 4px #fff, 0 2px 0 #fff;
    pointer-events: none;
    animation: dmgFloatUp .7s ease-out forwards;
    z-index: 6;
  }
  @keyframes dmgFloatUp {
    0% { transform: translate(-50%, 0); opacity: 1; }
    100% { transform: translate(-50%, -34px); opacity: 0; }
  }
  @keyframes victoryBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes defeatFall {
    0% { transform: rotate(0) translateY(0); opacity: 1; }
    100% { transform: rotate(75deg) translateY(8px); opacity: .35; }
  }
  .fighter.winner .emoji { animation: victoryBounce .6s ease infinite; }
  .fighter.loser .emoji { animation: defeatFall .6s ease forwards; }
  .fighter.winner, .fighter.loser { z-index: 11; }
  .hearts { display: flex; gap: 2px; font-size: 1rem; }
  .hearts span.lost { filter: grayscale(1) opacity(.3); }
  @keyframes heartPop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.5) rotate(-12deg); opacity: .8; }
    100% { transform: scale(1); opacity: .3; filter: grayscale(1); }
  }
  .hearts span.losing { animation: heartPop .45s ease; }
  .vs { font-size: 1.1rem; font-weight: 800; color: #a78bfa; }
  .progress { opacity: .65; font-size: .85rem; }

  .sentence-card {
    background: #fff8ea;
    border: 4px solid #ffd166;
    border-radius: 20px;
    padding: 22px 18px;
    box-shadow: 0 8px 24px rgba(80,50,140,.15);
    font-size: clamp(1.3rem, 5.5vw, 2rem);
    line-height: 2;
    text-align: center;
    max-width: 680px;
    width: 100%;
  }
  .char { display: inline-block; cursor: pointer; padding: 2px 1px; border-radius: 6px; }
  .char.punct { cursor: default; }
  .char.flash-wrong { animation: shakeRed .4s ease; }
  @keyframes shakeRed {
    0%, 100% { transform: translateX(0); background: transparent; }
    25% { transform: translateX(-5px); background: #ffb3b3; }
    75% { transform: translateX(5px); background: #ffb3b3; }
  }
  .char.tried-wrong { opacity: .35; text-decoration: line-through; cursor: not-allowed; }
  .char.fixed {
    display: inline-block;
    color: #2e9e3f;
    font-weight: 800;
    font-size: 1.4em;
    background: #d7f7df;
    box-shadow: 0 0 0 3px #6bd67a;
    border-radius: 6px;
    animation: fixedPop .4s ease;
  }
  @keyframes fixedPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  .instruction { opacity: .7; font-size: .95rem; text-align: center; max-width: 480px; min-height: 1.2em; }
  .feedback { font-size: 1.05rem; font-weight: 800; min-height: 1.4em; text-align: center; }
  .feedback.good { color: #2e9e3f; }
  .feedback.bad { color: #ff5d5d; }

  button {
    background: #4fc3f7;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  #restartBtn { background: #ff9f43; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(51,50,74,.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    color: #fff;
    z-index: 10;
  }
  .modal-overlay.show { display: flex; }
  .overlay-card {
    background: #fff8ea;
    color: #33324a;
    padding: 28px 36px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);

  .overlay-card h2 { color: #ff6b9d; margin-top: 0; }
  .overlay-card .emoji-big { font-size: 3.2rem; margin: 6px 0; }
  .pick-label { font-weight: 700; opacity: .7; margin: 10px 0 2px; }
  .grade-picker { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .grade-g2 { background: #4fc3f7; }
  .grade-g4 { background: #a78bfa; }
  .home-link {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 20;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    text-decoration: none;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);

  .home-link:active { transform: scale(.92); }
  @media (max-width: 480px) {
    .fighter { width: 78px; }
    .fighter .emoji { font-size: 2.1rem; }
    .hearts { font-size: .85rem; }
  }
</style>

    </div>

    <div class="sentence-card" id="sentenceEl"></div>

    <div class="instruction" id="instructionEl">找出句子裡寫錯的字，點下去攻擊怪獸！每題只能點一次，點準了才打得到～</div>
    <div class="feedback" id="feedbackEl"></div>

    <button id="restartBtn" type="button">🔁 重新選題</button>
  </div>

  <div id="startOverlay" class="modal-overlay show">
    <div class="overlay-card">
      <h2>怪獸出現了！⚔️</h2>

      <p class="pick-label">選擇題庫</p>
      <div class="grade-picker">
        <button class="gradeBtn grade-g2" data-grade="g2" type="button">二上期中 ▶</button>
        <button class="gradeBtn grade-g4" data-grade="g4" type="button">四上期中 ▶</button>
      </div>
    </div>
  </div>

  <div id="resultOverlay" class="modal-overlay">
    <div class="overlay-card">
      <h2 id="resultTitle">勝利！</h2>
      <div class="emoji-big" id="resultEmoji">🎉</div>
      <button id="resultRestartBtn" type="button">再戰一場 ▶</button>
    </div>
  </div>

const MONSTERS = ["👹","👺","🐉","👻","🧌","🦖","🐲","💀"];
const CJK = /[一-鿿]/;
const ROUNDS = 5;
const START_HP = 5;

const sentenceEl = document.getElementById("sentenceEl");
const instructionEl = document.getElementById("instructionEl");
const feedbackEl = document.getElementById("feedbackEl");
const progressEl = document.getElementById("progressEl");
const playerHeartsEl = document.getElementById("playerHearts");
const monsterHeartsEl = document.getElementById("monsterHearts");
const playerEmojiEl = document.getElementById("playerEmoji");
const monsterEmojiEl = document.getElementById("monsterEmoji");
const playerFighterEl = document.getElementById("playerFighter");
const monsterFighterEl = document.getElementById("monsterFighter");
const arenaEl = document.getElementById("arena");
const startOverlay = document.getElementById("startOverlay");
const startMonsterPreview = document.getElementById("startMonsterPreview");
const resultOverlay = document.getElementById("resultOverlay");
const resultTitle = document.getElementById("resultTitle");
const resultEmoji = document.getElementById("resultEmoji");

let pool = [];
let qIndex = 0;
let playerHP = START_HP;
let monsterHP = START_HP;
let locked = false;
let battleEnded = false;
let currentMonster = MONSTERS[0];
let prevPlayerHP = START_HP;
let prevMonsterHP = START_HP;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderHearts(el, hp, prevHp) {
  el.innerHTML = "";
  for (let i = 0; i < START_HP; i++) {
    const span = document.createElement("span");
    span.textContent = "❤️";
    if (i >= hp) span.classList.add("lost");
    if (i === hp && hp < prevHp) span.classList.add("losing");
    el.appendChild(span);
  }
}

function renderHP() {
  renderHearts(playerHeartsEl, playerHP, prevPlayerHP);
  renderHearts(monsterHeartsEl, monsterHP, prevMonsterHP);
  prevPlayerHP = playerHP;
  prevMonsterHP = monsterHP;
}

function spawnEffect(fighterEl, className, content) {
  const el = document.createElement("div");
  el.className = className;
  el.textContent = content;
  fighterEl.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}

function spawnBreath(flyClass, emoji) {
  for (let i = 0; i < 3; i++) {
    const p = document.createElement("div");
    p.className = `projectile ${flyClass}`;
    p.textContent = emoji;
    p.style.top = (40 + i * 7) + "%";
    p.style.animationDelay = (i * 55) + "ms";
    arenaEl.appendChild(p);
    p.addEventListener("animationend", () => p.remove());
  }
}

function attack(attackerEl, lungeClass, flyClass, breathEmoji, burstEmoji, defenderEl, defenderFighterEl, onImpact) {
  attackerEl.classList.remove("lunge-left", "lunge-right");
  void attackerEl.offsetWidth;
  attackerEl.classList.add(lungeClass);
  spawnBreath(flyClass, breathEmoji);
  setTimeout(() => {
    defenderEl.classList.remove("hit");
    void defenderEl.offsetWidth;
    defenderEl.classList.add("hit");
    spawnEffect(defenderFighterEl, "burst", burstEmoji);
    spawnEffect(defenderFighterEl, "dmgFloat", "-1");
    onImpact();
  }, 180);
  setTimeout(() => attackerEl.classList.remove(lungeClass), 500);
  setTimeout(() => defenderEl.classList.remove("hit"), 560);
}

function renderSentence(q) {
  sentenceEl.innerHTML = "";
  const chars = Array.from(q.s);
  const wrongIndex = chars.findIndex(ch => ch === q.w);
  chars.forEach((ch, i) => {
    const span = document.createElement("span");
    const clickable = CJK.test(ch);
    span.className = "char" + (clickable ? "" : " punct");
    span.textContent = ch;
    if (clickable) span.addEventListener("click", () => onCharClick(i, wrongIndex, span, q));
    sentenceEl.appendChild(span);
  });
}

function loadQuestion() {
  locked = false;
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  progressEl.textContent = `第 ${qIndex + 1} / ${ROUNDS} 題`;
  instructionEl.textContent = "找出句子裡寫錯的字，點下去攻擊怪獸！點錯會被反擊扣血，但可以繼續找～";
  renderSentence(pool[qIndex]);
}

function onCharClick(i, wrongIndex, span, q) {
  if (locked || battleEnded) return;
  if (span.classList.contains("tried-wrong")) return;
  if (i === wrongIndex) {
    locked = true;
    span.textContent = q.c;
    span.classList.add("fixed");
    feedbackEl.className = "feedback good";
    feedbackEl.textContent = `攻擊成功！正確的字是「${q.c}」`;
    attack(playerEmojiEl, "lunge-right", "fly-right", "🔥", "🔥", monsterEmojiEl, monsterFighterEl, () => {
      monsterHP--;
      renderHP();
    });
    setTimeout(nextQuestion, 3400);
  } else {
    span.classList.add("flash-wrong", "tried-wrong");
    feedbackEl.className = "feedback bad";
    feedbackEl.textContent = "這個字是對的，再找找看！（扣了 1 滴血）";
    setTimeout(() => span.classList.remove("flash-wrong"), 400);
    attack(monsterEmojiEl, "lunge-left", "fly-left", "💧", "💦", playerEmojiEl, playerFighterEl, () => {
      playerHP--;
      renderHP();
      if (playerHP <= 0) {
        battleEnded = true;
        revealAnswer(wrongIndex, q);
        setTimeout(finishBattle, 1800);
      }
    });
  }
}

function revealAnswer(wrongIndex, q) {
  const span = sentenceEl.children[wrongIndex];
  span.textContent = q.c;
  span.classList.add("fixed");
  feedbackEl.className = "feedback bad";
  feedbackEl.textContent = `血量用完了，正確的字是「${q.c}」`;
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= ROUNDS || playerHP <= 0 || monsterHP <= 0) {
    finishBattle();
  } else {
    loadQuestion();
  }
}

function finishBattle() {
  const win = playerHP > monsterHP;
  resultTitle.textContent = win ? "勝利！" : "怪獸贏了…";
  resultEmoji.textContent = win ? "🎉" : "😵";
  playerFighterEl.classList.toggle("winner", win);
  playerFighterEl.classList.toggle("loser", !win);
  monsterFighterEl.classList.toggle("winner", !win);
  monsterFighterEl.classList.toggle("loser", win);
  resultOverlay.classList.add("show");
}

let currentGrade = "g2";

function startBattle(gradeKey) {
  if (gradeKey) currentGrade = gradeKey;
  pool = shuffle(QUESTION_BANKS[currentGrade]).slice(0, ROUNDS);
  qIndex = 0;
  playerHP = START_HP;
  monsterHP = START_HP;
  prevPlayerHP = START_HP;
  prevMonsterHP = START_HP;
  battleEnded = false;
  playerFighterEl.classList.remove("winner", "loser");
  monsterFighterEl.classList.remove("winner", "loser");
  currentMonster = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
  monsterEmojiEl.textContent = currentMonster;
  renderHP();
  startOverlay.classList.remove("show");
  resultOverlay.classList.remove("show");
  loadQuestion();
}

document.querySelectorAll(".gradeBtn").forEach(btn => {
  btn.onclick = () => startBattle(btn.dataset.grade);
});
document.getElementById("resultRestartBtn").onclick = () => startBattle();
document.getElementById("restartBtn").onclick = () => {
  resultOverlay.classList.remove("show");
  startOverlay.classList.add("show");
};

startMonsterPreview.textContent = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
renderHP();
</script>
</body>
</html>
